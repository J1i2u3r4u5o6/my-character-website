<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>角色介紹</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <a href="/">首頁</a>
        <a href="/characters">角色介紹</a>
        <a href="/story">故事大綱</a>
        <a href="/team">團隊介紹</a>
    </nav>

    <h1 class="page-title">角色介紹</h1>

    <div class="card-container">

        <div class="card">
            <img src="{{ url_for('static', filename='images/character1.jpg') }}" class="character-img">
            <h2>角色一：艾爾</h2>
            <p>年齡：17歲</p>
            <p>個性：勇敢、衝動、重視朋友。</p>
            <p>介紹：艾爾是故事中的主角，擁有強大的意志力，正在尋找失落的真相。</p>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='images/character2.jpg') }}" class="character-img">
            <h2>角色二：莉娜</h2>
            <p>年齡：16歲</p>
            <p>個性：冷靜、聰明、觀察力強。</p>
            <p>介紹：莉娜是團隊中的智囊，常常在危機中找到解決方法。</p>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='images/character3.jpg') }}" class="character-img">
            <h2>角色三：凱</h2>
            <p>年齡：18歲</p>
            <p>個性：神秘、沉默、實力強大。</p>
            <p>介紹：凱的過去充滿謎團，他似乎知道故事背後的重要秘密。</p>
        </div>

    </div>

</body>
</html>
