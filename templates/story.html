    <h1 class="page-title">故事大綱</h1>

    <div class="story-box">
        <p>
            在一個被神秘力量籠罩的世界裡，主角艾爾意外發現自己與古老傳說有關。
            為了尋找失落的真相，他與夥伴們踏上旅程。
        </p>

        <p>
            途中，他們遇見了不同的敵人、朋友與挑戰。
            每一次選擇都會改變他們的命運，也逐漸揭開世界背後隱藏的秘密。
        </p>

        <p>
            最後，他們必須面對真正的敵人，並決定這個世界未來的方向。
        </p>
